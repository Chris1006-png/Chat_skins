kind = "web"
previewPath = "/"
title = "FarmCity"
description = "Un mundo social pixel-art donde los jugadores crean su avatar, exploran una plaza compartida, chatean y se encuentran en tiempo real."
version = "1.0.0"
id = "artifacts/salas1"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24564

[services.development]
run = "pnpm --filter @workspace/salas1 run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/salas1", "run", "build" ]
serve = "static"
publicDir = "artifacts/salas1/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24564"
BASE_PATH = "/"
